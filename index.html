        body {

        .creme-box {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            background-color: #FFFDF4; /* 黄油白 */
            border: 1px solid #E8D8B5;
            box-shadow: 0 4px 18px -2px rgba(138, 107, 72, 0.08);
        }

            border-color: #C29B63;
            background-color: #FFFFFF;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -4px rgba(138, 107, 72, 0.16);
        }

        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        let currentStep = treeData;

        function renderGrid(data) {
            const container = document.getElementById('app-container');
            const subTitle = document.getElementById('sub-title');
            
            subTitle.innerText = data.title;
            
            let html = '<div id="grid-matrix" class="grid grid-cols-2 gap-4 fade-in">';
            data.options.forEach(opt => {
                html += `
                    <div onclick="handleSelect('${opt.id}')" class="creme-box p-5 rounded-2xl flex flex-col justify-between cursor-pointer text-left aspect-[4/3]">
                        <span class="text-sm font-semibold text-[#2D241E] tracking-wide">${opt.name}</span>
                        <span class="text-[11px] text-[#7A644D] tracking-tight leading-relaxed mt-2 font-light">${opt.detail}</span>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function handleSelect(id) {
            const nextNode = currentStep.next[id];

            // 判断是否到了末级书库（books 数组）
            if (nextNode.books && nextNode.books.length > 0) {
                // 🎲 核心逻辑：从书库中随机抽取一本
                const randomIndex = Math.floor(Math.random() * nextNode.books.length);
                const selectedBook = nextNode.books[randomIndex];
                
                renderResult(selectedBook);
                document.getElementById('reset-btn').classList.remove('hidden');
            } else {
                currentStep = nextNode;
                renderGrid(nextNode);
            }
        }

                        <span class="text-[10px] font-serif-title text-[#9C8263] tracking-widest">[ ${res.tag} ]</span>
                    </div>
                    
                    <h2 class="text-xl font-medium text-[#2D241E] mb-4 leading-snug tracking-wide font-serif-title">${res.book}</h2>
                    
                    <blockquote class="text-xs text-[#544436] italic border-l-2 border-[#C29B63] pl-4 my-5 leading-relaxed font-serif">
                        ${res.quote}
                    </blockquote>
                    
                    <p class="text-xs text-[#705E4E] leading-relaxed font-light mb-6 tracking-wide">
                        ${res.summary}
                    </p>

                    <div class="pt-4 border-t border-[#F2E4C4] flex justify-between items-center text-[10px] text-[#8C6F47] font-serif-title">
                        <span class="tracking-widest">Crème de la Crème 🥐</span>
                        <span class="text-[#A38867]">[ 长按或截图保存餐单 📸 ]</span>
                    </div>
                </div>
            `;
        }

        function resetFlow() {
            currentStep = treeData;
            renderGrid(treeData);
            document.getElementById('reset-btn').classList.add('hidden');
        }

        // 初始化渲染第一层
        renderGrid(treeData);
    </script>
</body>
</html>
